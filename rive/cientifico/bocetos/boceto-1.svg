    <path d="M152 190 L136 192 L148 300 L166 298 Z" fill="#e9eef2"/>
    <circle cx="62" cy="310" r="9" fill="#f1c9a5"/>
    <circle cx="160" cy="310" r="9" fill="#f1c9a5"/>
