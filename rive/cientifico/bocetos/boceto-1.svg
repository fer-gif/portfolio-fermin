    <path d="M92 136 Q110 144 130 134" fill="none"/>
    <path d="M140 118 q6 8 1 18" fill="none" stroke-width="2"/>
    <path d="M78 122 q-6 8 -1 16" fill="none" stroke-width="2"/>
