    <rect x="72" y="46" width="76" height="8" rx="3" fill="#3a4a3f"/>
    <circle cx="93" cy="50" r="10" fill="#7ee35b"/>
    <circle cx="127" cy="50" r="10" fill="#7ee35b"/>
