    <path d="M76 78 L98 84 L112 90 L126 84 L146 78" fill="none" stroke-width="6"/>
    <!-- nariz grande y angulosa -->
    <path d="M113 94 Q128 112 118 126 Q110 128 106 122" fill="#e3b48f"/>
