    <circle cx="97" cy="98" r="15" fill="#ffffff"/>
    <circle cx="126" cy="98" r="15" fill="#ffffff"/>
    <rect x="80" y="80" width="34" height="12" fill="#f1c9a5" clip-path="url(#ojoI)" stroke="none"/>
    <rect x="109" y="80" width="34" height="12" fill="#f1c9a5" clip-path="url(#ojoD)" stroke="none"/>
    <path d="M83 92 L111 92" fill="none"/>
    <path d="M112 92 L140 92" fill="none"/>
    <circle cx="100" cy="101" r="3" fill="#1a1a1a" stroke="none"/>
    <circle cx="129" cy="101" r="3" fill="#1a1a1a" stroke="none"/>
